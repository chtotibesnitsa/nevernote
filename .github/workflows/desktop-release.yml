name: Desktop release

# Push a tag like v1.0.0 to build the Mac and Windows apps and attach them to a
# GitHub release. Without signing secrets the builds are unsigned (macOS will
# ask users to right-click → Open the first time).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # When started by hand, tag this commit v<desktop version> so the release has a tag.
  # A re-run before the release is published moves the tag to the new commit.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch'
        run: |
          v="v$(node -p "require('./apps/desktop/package.json').version")"
          if gh release view "$v" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "$v is already published; leaving its tag alone"
          else
            git tag -f "$v" && git push -f origin "refs/tags/$v"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            args: --mac --arm64
          - os: macos-15-intel # Intel
            args: --mac --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @nevernote/desktop
      - name: Package and publish
        working-directory: apps/desktop
        shell: bash
        # Empty secrets arrive as empty strings, which electron-builder reads as a
        # certificate path; drop them so unsigned builds work.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing and notarisation (macOS): add these repository secrets.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
