name: Desktop release

# Push a tag like v1.0.0 to build the Mac and Windows apps and attach them to a
# GitHub release. Without signing secrets the builds are unsigned (macOS will
# ad-hoc sign them; users approve them once in System Settings).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Prepare one draft release for the builds to upload into (parallel builds each
  # creating their own release made duplicates). When started by hand, also tag
  # this commit v<desktop version>. A release that already has its Mac and Windows
  # installers is never touched.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          v="v$(node -p "require('./apps/desktop/package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          done=0
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.tag_name == \"$v\") | .id"); do
            names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" -q '[.assets[].name] | join(" ")')
            if [[ $names == *.dmg* && $names == *.exe* ]]; then done=1; else gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; fi
          done
          if [ $done = 1 ]; then echo "$v is complete; nothing to do"; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git tag -f "$v" && git push -f origin "refs/tags/$v"
          fi
          gh release create "$v" --draft --verify-tag --title "Nevernote ${v#v}" --notes "Free, on-device class transcriber for Mac and Windows. Download the .dmg for Mac (arm64 = Apple Silicon) or the Setup .exe for Windows."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            args: --mac --arm64
          - os: macos-15-intel # Intel
            args: --mac --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @nevernote/desktop
      - name: Package and publish
        working-directory: apps/desktop
        shell: bash
        # Empty secrets arrive as empty strings, which electron-builder reads as a
        # certificate path; drop them so unsigned builds work.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing and notarisation (macOS): add these repository secrets.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      # Catch a broken signature before students do ("Nevernote is damaged").
      - name: Check the Mac app's signature
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          app=$(find release -maxdepth 2 -name "Nevernote.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"

  # Publish only once every installer is attached.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ needs.prepare.outputs.tag }}" -R "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
