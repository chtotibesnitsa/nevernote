name: Deploy website

# Publishes a forwarding page to GitHub Pages that sends visitors to the real site.
# One-time setup: Settings → Pages → Source: GitHub Actions. Set the variable VITE_SITE_URL once the real domain is live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nevernote lives on Vercel now. This old address only forwards there, so a
      # stale link or a Google sign-in sent back here still lands in the real app.
      - run: |
          mkdir -p out
          sed "s#__SITE__#${SITE}#" apps/web/pages-redirect/index.html > out/index.html
          cp out/index.html out/404.html
        env:
          SITE: ${{ vars.VITE_SITE_URL || 'https://nevernote-git-site-v3-cookerprojects.vercel.app' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
